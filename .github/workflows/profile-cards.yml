name: Update profile cards

on:
  schedule:
    - cron: "30 4 * * *"   # once a day (04:30 UTC) — edit to taste
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p profile

      - name: Generate GitHub stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_border=true&count_private=true&bg_color=0A0E14&title_color=E8A854&text_color=E9EDF4&icon_color=4FD1C5&border_color=1A2333"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0A0E14&title_color=E8A854&text_color=E9EDF4&border_color=1A2333"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution timeline
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_activity_graph.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || echo "Nothing to commit"
          git push
