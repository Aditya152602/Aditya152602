name: Update profile cards

on:
  schedule:
    - cron: "30 4 * * *"   # once a day (04:30 UTC) — edit to taste
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p profile

      - name: Generate GitHub stats card
        id: stats
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_border=true&count_private=true&bg_color=0A0E14&title_color=E8A854&text_color=E9EDF4&icon_color=4FD1C5&border_color=1A2333"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        id: top_langs
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0A0E14&title_color=E8A854&text_color=E9EDF4&border_color=1A2333"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution timeline
        id: activity_graph
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_activity_graph.py

      # Runs even if a step above failed, so whichever cards DID generate
      # still make it into the repo instead of all-or-nothing.
      - name: Commit and push whatever succeeded
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || echo "Nothing to commit"
          git push

      # The job still shows red if something failed, so it doesn't go
      # unnoticed, even though the working cards were already pushed above.
      - name: Fail the run if any card had a problem
        if: steps.stats.outcome == 'failure' || steps.top_langs.outcome == 'failure' || steps.activity_graph.outcome == 'failure'
        run: |
          echo "stats: ${{ steps.stats.outcome }}"
          echo "top-langs: ${{ steps.top_langs.outcome }}"
          echo "activity-graph: ${{ steps.activity_graph.outcome }}"
          exit 1
